name: Platform Web Build and Evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: platform-web-v6-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Godot 4.7.2 and Web export templates
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_ZIP="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          TEMPLATES="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl -fL "$BASE/$GODOT_ZIP" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" /usr/local/bin/godot
          curl -fL "$BASE/$TEMPLATES" -o /tmp/templates.tpz
          mkdir -p /tmp/templates "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.$GODOT_STATUS"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.$GODOT_STATUS/"
          godot --version
          godot --version | grep -q "^$GODOT_VERSION.$GODOT_STATUS.official"

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Build runtime game PCKs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/runtime-packs
          godot --headless --path . --script res://tools/build_runtime_packs.gd
          test -s build/runtime-packs/stub_packed.pck
          ls -lh build/runtime-packs/stub_packed.pck
          sha256sum build/runtime-packs/stub_packed.pck

      - name: A1 input foundation smoke
        run: godot --headless --path . --script res://tests/a1_smoke.gd

      - name: A2 module contract smoke
        run: timeout 30s godot --headless --verbose --path . --script res://tests/a2_contract_smoke.gd

      - name: A3 shell hub smoke
        run: timeout 30s godot --headless --verbose --path . --script res://tests/a3_hub_smoke.gd

      - name: A4 runtime PCK and platform smoke
        run: timeout 30s godot --headless --verbose --path . --script res://tests/a4_pack_smoke.gd

      - name: B3 Flash shim primitive unit tests
        shell: bash
        run: |
          set -euxo pipefail
          for TEST in \
            test_fixed_clock.gd \
            test_movie_clip.gd \
            test_hit_shape.gd \
            test_input_reader.gd \
            test_random.gd \
            test_audio.gd \
            test_module_contract.gd
          do
            timeout 30s godot --headless --verbose --path . --script "res://tests/pacman_b3/$TEST"
          done

      - name: B4 source asset/timeline unit tests
        shell: bash
        run: |
          set -euxo pipefail
          for TEST in \
            test_assets_and_timelines.gd \
            test_visual_timeline.gd \
            test_text_and_audio.gd \
            test_module_visual.gd
          do
            timeout 90s godot --headless --verbose --path . --script "res://tests/pacman_b4/$TEST"
          done

      - name: Verify single-threaded export configuration
        shell: bash
        run: |
          grep -q 'variant/thread_support=false' export_presets.cfg
          ! grep -q 'variant/thread_support=true' export_presets.cfg
          grep -q 'vram_texture_compression/for_mobile=false' export_presets.cfg

      - name: Diagnose Web export templates
        shell: bash
        run: |
          set -euxo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$GODOT_VERSION.$GODOT_STATUS"
          ls -lah "$TEMPLATE_DIR"/web*.zip
          test -s "$TEMPLATE_DIR/web_nothreads_release.zip"
          test -s "$TEMPLATE_DIR/web_nothreads_debug.zip"

      - name: Export Web release
        shell: bash
        run: |
          mkdir -p build/web
          godot --headless --verbose --path . --export-release "Web" build/web/index.html
          godot --headless --path . --script res://tools/stage_runtime_packs.gd
          touch build/web/.nojekyll
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          test -s build/web/packs/stub_packed.pck
          find build/web -maxdepth 3 -type f -printf '%P %s bytes\n' | sort

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Local desktop and mobile-emulation boot smoke
        shell: bash
        run: |
          python3 -m http.server 8080 --directory build/web >/tmp/gamezone-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/index.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/web_smoke.mjs http://127.0.0.1:8080/index.html desktop
          node tests/web_smoke.mjs http://127.0.0.1:8080/index.html mobile

      - name: Upload platform CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-ci-evidence
          path: artifacts/
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-desktop-smoke:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify deployed HTTPS build with runtime PCK
        shell: bash
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euxo pipefail
          test -n "$PAGE_URL"
          node tests/web_smoke.mjs "$PAGE_URL" desktop
      - name: Upload live desktop evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-live-desktop-evidence
          path: artifacts/
          if-no-files-found: error
